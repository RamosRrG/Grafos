<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafo Acadêmico – Cypher vs SQL</title>
<style>
:root{--bg:#f4f6fb;--fg:#1c2233;--mut:#5d6785;--edge:90,106,140;--a:#e8590c;--b:#1971c2;--res:#d6336c;--tp:#4c6ef5;--te:#2f9e44;--ti:#f08c00;--panel:rgba(255,255,255,.93);--code:#eef1f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f1a;--fg:#e6e9f2;--mut:#9aa5c4;--edge:120,140,190;--a:#ffa94d;--b:#4dabf7;--res:#ff6b9d;--tp:#748ffc;--te:#51cf66;--ti:#ffd43b;--panel:rgba(20,26,42,.93);--code:#0f1524}}
:root[data-theme="dark"]{--bg:#0b0f1a;--fg:#e6e9f2;--mut:#9aa5c4;--edge:120,140,190;--a:#ffa94d;--b:#4dabf7;--res:#ff6b9d;--tp:#748ffc;--te:#51cf66;--ti:#ffd43b;--panel:rgba(20,26,42,.93);--code:#0f1524}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.leg{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;display:flex;gap:12px;flex-wrap:wrap;font-size:13px;background:var(--panel);padding:6px 12px;border-radius:10px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.panel{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:900px;background:var(--panel);border-radius:14px;padding:12px;font-size:14px;backdrop-filter:blur(8px);box-shadow:0 4px 24px rgba(0,0,0,.18)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
select{background:var(--code);color:var(--fg);border:1px solid rgba(128,128,160,.35);border-radius:8px;padding:6px 8px;font-size:14px;max-width:100%}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
h4{margin:0 0 4px;font-size:12.5px;color:var(--mut);font-weight:600}h4 b{color:var(--res)}
pre{margin:0;background:var(--code);padding:8px 10px;border-radius:8px;font:11.5px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:150px;overflow:auto;color:var(--fg)}
.res{line-height:1.45}.res b{color:var(--res)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="leg"><span><i style="background:var(--tp)"></i>Aluno</span><span><i style="background:var(--te)"></i>Disciplina</span><span><i style="background:var(--ti)"></i>Professor</span></div>
<div class="panel">
  <div class="row">
    <select id="q">
      <option value="1">1. Pré-requisitos (saltos variáveis)</option>
      <option value="2">2. Quem pode cursar? (nota na relação)</option>
      <option value="3">3. Recomendar disciplinas (amigos)</option>
      <option value="4">4. Caminho mais curto aluno → professor</option>
    </select>
    <select id="sa"></select>
    <select id="sb"></select>
  </div>
  <div class="cols">
    <div><h4>Cypher <b id="hc"></b></h4><pre id="cy"></pre></div>
    <div><h4>SQL relacional <b id="hs"></b></h4><pre id="sq"></pre></div>
  </div>
  <div class="res" id="out"></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(5);
const S=["Lucas","Louise","Gustavo","Ana","Marta","Gabriel","Bia","Caio","Helô","Igor","Jade","Kaique","Lara","Mateus","Nina","Otávio","Paula","Renan","Sofia","Théo"],
D=["Lógica","Algoritmos","Estatística","Estrutura de Dados","Programação Web","Banco de Dados","Engenharia de Software","Ciência de Dados","Matemática Discreta","Arquitetura de Computadores","Sistemas Operacionais","Redes de Computadores","Segurança da Informação","Computação em Nuvem","Aprendizado de Máquina"],
LV=[0,1,0,2,2,3,3,4,0,1,2,2,3,3,5],P=["Helena","Jorge","Rui","Marcos","Sônia"];
const si=n=>S.indexOf(n),di=n=>S.length+D.indexOf(n),pi=n=>S.length+D.length+P.indexOf(n);
const nodes=[],adj=[],edges=[],seen=new Set();
S.forEach(n=>{const u=R()*2-1,t=R()*6.283,s=Math.sqrt(1-u*u),r=.85+R()*.2;nodes.push({t:'Aluno',name:n,x:r*s*Math.cos(t),y:r*u,z:r*s*Math.sin(t)})});
D.forEach((n,i)=>nodes.push({t:'Disciplina',name:n,x:(LV[i]-2)*.3,y:(R()-.5)*.6,z:(R()-.5)*.6}));
P.forEach(n=>{const u=R()*2-1,t=R()*6.283,s=Math.sqrt(1-u*u);nodes.push({t:'Professor',name:n,x:1.25*s*Math.cos(t),y:1.25*u,z:1.25*s*Math.sin(t)})});
nodes.forEach(()=>adj.push([]));
function link(a,b,rel,p){const k=a+'-'+b+rel;if(seen.has(k))return;seen.add(k);edges.push({a,b,rel});adj[a].push({to:b,rel,dir:1,p});adj[b].push({to:a,rel,dir:-1,p})}
[['Lógica','Algoritmos'],['Algoritmos','Estrutura de Dados'],['Algoritmos','Programação Web'],['Estrutura de Dados','Banco de Dados'],['Programação Web','Engenharia de Software'],['Estrutura de Dados','Engenharia de Software'],['Banco de Dados','Ciência de Dados'],['Estatística','Ciência de Dados'],['Lógica','Arquitetura de Computadores'],['Matemática Discreta','Arquitetura de Computadores'],['Arquitetura de Computadores','Sistemas Operacionais'],['Algoritmos','Sistemas Operacionais'],['Arquitetura de Computadores','Redes de Computadores'],['Redes de Computadores','Segurança da Informação'],['Sistemas Operacionais','Segurança da Informação'],['Banco de Dados','Segurança da Informação'],['Redes de Computadores','Computação em Nuvem'],['Sistemas Operacionais','Computação em Nuvem'],['Programação Web','Computação em Nuvem'],['Ciência de Dados','Aprendizado de Máquina'],['Estatística','Aprendizado de Máquina']].forEach(([a,b])=>link(di(a),di(b),'PRE_REQUISITO'));
const ens={Helena:["Lógica","Algoritmos","Estatística","Matemática Discreta"],Jorge:["Estrutura de Dados","Banco de Dados"],Rui:["Programação Web","Engenharia de Software","Ciência de Dados"],Marcos:["Arquitetura de Computadores","Sistemas Operacionais","Redes de Computadores"],Sônia:["Segurança da Informação","Computação em Nuvem","Aprendizado de Máquina"]};
for(const p in ens)ens[p].forEach(d=>link(pi(p),di(d),'MINISTRA'));
const cur={Lucas:[8.5,7.5,8],Louise:[9.5,9,6],Gustavo:[7,6.5],Ana:[8,8.5,9],Marta:[7.5,8],Gabriel:[9,7.5,7.5,8,8],Bia:[8,9,8.5],Caio:[6.5,7]};
const ord=["Lógica","Algoritmos","Estrutura de Dados","Banco de Dados","Programação Web"]; // Gabriel: BD e PW
const seq={Gabriel:["Lógica","Algoritmos","Estrutura de Dados","Banco de Dados","Programação Web"]};
for(const a in cur)cur[a].forEach((nota,k)=>{const d=(seq[a]||ord)[k],l=LV[D.indexOf(d)];link(si(a),di(d),'CURSOU',{nota,semestre:l<=1?'2025.1':l<=2?'2025.2':'2026.1'})});
const mat={Lucas:["Banco de Dados"],Louise:["Programação Web"],Gustavo:["Estrutura de Dados"],Ana:["Banco de Dados","Estatística"],Marta:["Programação Web","Estatística"],Gabriel:["Engenharia de Software"],Bia:["Estatística"],Caio:["Programação Web"]};
for(const a in mat)mat[a].forEach(d=>link(si(a),di(d),'MATRICULADO_EM'));
const sem=d=>{const l=LV[D.indexOf(d)];return l<=1?'2025.1':l<=2?'2025.2':'2026.1'};
const ex={Helô:[["Lógica",8],["Matemática Discreta",9],["Arquitetura de Computadores",8.5]],Igor:[["Lógica",7.5],["Algoritmos",8],["Estrutura de Dados",8]],Jade:[["Lógica",9],["Matemática Discreta",8],["Arquitetura de Computadores",7.5],["Redes de Computadores",8]],Kaique:[["Lógica",6.5],["Algoritmos",6]],Lara:[["Lógica",9],["Algoritmos",9.5],["Estrutura de Dados",9],["Programação Web",9],["Banco de Dados",8.5]],Mateus:[["Lógica",8],["Algoritmos",8.5],["Estatística",7.5]],Nina:[["Lógica",9],["Algoritmos",8],["Estrutura de Dados",8.5],["Estatística",8]],Otávio:[["Lógica",8],["Matemática Discreta",8],["Arquitetura de Computadores",9],["Sistemas Operacionais",8],["Redes de Computadores",7.5]],Paula:[["Lógica",7],["Algoritmos",7.5],["Programação Web",8]],Renan:[["Lógica",8],["Algoritmos",7],["Estrutura de Dados",9]],Sofia:[["Lógica",9],["Algoritmos",9],["Estrutura de Dados",9],["Banco de Dados",9],["Estatística",8.5],["Programação Web",8],["Engenharia de Software",9]],Théo:[["Lógica",8.5],["Matemática Discreta",7],["Arquitetura de Computadores",8],["Sistemas Operacionais",7.5],["Redes de Computadores",8]]};
const em={Helô:["Sistemas Operacionais","Redes de Computadores"],Igor:["Programação Web"],Jade:["Sistemas Operacionais"],Kaique:["Estrutura de Dados"],Lara:["Engenharia de Software","Estatística"],Mateus:["Programação Web","Estrutura de Dados"],Nina:["Banco de Dados","Programação Web"],Otávio:["Segurança da Informação","Computação em Nuvem"],Paula:["Estrutura de Dados"],Renan:["Banco de Dados"],Sofia:["Ciência de Dados"],Théo:["Computação em Nuvem","Segurança da Informação"]};
for(const a in ex)ex[a].forEach(([d,nota])=>link(si(a),di(d),'CURSOU',{nota,semestre:sem(d)}));
for(const a in em)em[a].forEach(d=>link(si(a),di(d),'MATRICULADO_EM'));
[['Lucas','Louise'],['Lucas','Gustavo'],['Louise','Ana'],['Gustavo','Marta'],['Gustavo','Gabriel'],['Ana','Marta'],['Gabriel','Bia'],['Bia','Caio'],['Louise','Helô'],['Ana','Igor'],['Ana','Lara'],['Bia','Mateus'],['Caio','Paula'],['Helô','Jade'],['Helô','Otávio'],['Igor','Kaique'],['Igor','Lara'],['Jade','Otávio'],['Jade','Théo'],['Kaique','Paula'],['Lara','Mateus'],['Lara','Sofia'],['Mateus','Nina'],['Nina','Sofia'],['Nina','Renan'],['Otávio','Théo'],['Paula','Renan'],['Renan','Sofia'],['Sofia','Théo'],['Lucas','Nina'],['Marta','Mateus'],['Gabriel','Sofia'],['Louise','Jade'],['Bia','Paula'],['Caio','Kaique'],['Helô','Théo'],['Igor','Renan'],['Lucas','Helô'],['Ana','Nina'],['Lara','Nina']].forEach(([a,b])=>link(si(a),si(b),'AMIGO_DE'));
const nm=i=>nodes[i].name,inc=(n,r)=>adj[n].filter(e=>e.rel===r&&e.dir<0),out=(n,r)=>adj[n].filter(e=>e.rel===r&&e.dir>0);
const nota=(a,p)=>out(a,'CURSOU').find(e=>e.to===p)?.p.nota;
function pres(d){const sn=new Set(),ed=[];let fr=[d],lv=0;while(fr.length){const nx=[];for(const u of fr)for(const e of inc(u,'PRE_REQUISITO')){ed.push([e.to,u]);if(!sn.has(e.to)){sn.add(e.to);nx.push(e.to)}}if(nx.length)lv++;fr=nx}return{set:sn,ed,lv}}

// ---- consultas ----
let hl={},hle=new Set(),elab=new Map();
const ek=(a,b)=>Math.min(a,b)+'-'+Math.max(a,b),E=(a,b)=>hle.add(ek(a,b)),L=(a,b,t)=>elab.set(ek(a,b),t);
function run(){
  hl={};hle=new Set();elab=new Map();
  const q=$('q').value,a=+$('sa').value,b=+$('sb').value,A=nm(a),B=nm(b);
  let cy,sq,o;
  if(q==='1'){
    cy=`MATCH (pre:Disciplina)-[:PRE_REQUISITO*]->\n      (:Disciplina {nome:'${B}'})\nRETURN DISTINCT pre.nome`;
    sq=`WITH RECURSIVE pre AS (\n  SELECT id_pre FROM pre_requisito\n   WHERE id_disc = (SELECT id FROM disciplina\n                     WHERE nome='${B}')\n  UNION\n  SELECT p.id_pre FROM pre_requisito p\n   JOIN pre ON p.id_disc = pre.id_pre\n)\nSELECT d.nome FROM pre\n JOIN disciplina d ON d.id = pre.id_pre;`;
    const x=pres(b);hl[b]='src';x.set.forEach(p=>hl[p]='mid');x.ed.forEach(([p,c])=>E(p,c));
    o=x.set.size?`Pré-requisitos de <b>${B}</b>: <b>${[...x.set].map(nm).join(', ')}</b> (${x.lv} níveis de profundidade)`:`<b>${B}</b> não tem pré-requisitos.`;
  }else if(q==='2'){
    cy=`MATCH (pre:Disciplina)-[:PRE_REQUISITO*]->\n      (d:Disciplina {nome:'${B}'})\nWITH d, collect(DISTINCT pre) AS exigidas\nMATCH (a:Aluno)\nWHERE NOT (a)-[:CURSOU]->(d)\n  AND ALL(p IN exigidas WHERE EXISTS {\n    (a)-[r:CURSOU]->(p) WHERE r.nota > 7 })\nRETURN a.nome`;
    sq=`WITH RECURSIVE pre AS ( /* CTE do exemplo 1 */ )\nSELECT a.nome FROM aluno a\n WHERE NOT EXISTS (\n   SELECT 1 FROM cursou c0\n    WHERE c0.id_aluno=a.id AND c0.id_disc=d.id)\n   AND NOT EXISTS (\n   SELECT 1 FROM pre\n    WHERE NOT EXISTS (\n      SELECT 1 FROM cursou c\n       WHERE c.id_aluno = a.id\n         AND c.id_disc  = pre.id_pre\n         AND c.nota > 7));`;
    const x=pres(b),el=[],fora=[];
    S.forEach((n,i)=>{if(out(i,'CURSOU').some(e=>e.to===b))return;let why=null;
      for(const p of x.set){const v=nota(i,p);if(v==null){why=`sem ${nm(p)}`;break}if(v<=7){why=`${nm(p)} ${v}`;break}}
      why?fora.push(`${n} (${why})`):el.push(i)});
    hl[b]='src';x.set.forEach(p=>hl[p]='mid');x.ed.forEach(([p,c])=>E(p,c));
    el.forEach(i=>{hl[i]='res';x.set.forEach(p=>{E(i,p);L(i,p,nota(i,p))})});
    o=`Podem cursar <b>${B}</b> (nota > 7 em todos os pré-requisitos): <b>${el.map(nm).join(', ')||'ninguém'}</b>.<br>Ficam de fora: ${fora.slice(0,4).join(', ')||'—'}`;
  }else if(q==='3'){
    cy=`MATCH (a:Aluno {nome:'${A}'})-[:AMIGO_DE]-(f:Aluno)\n      -[:CURSOU|MATRICULADO_EM]->(d:Disciplina)\nWHERE NOT (a)-[:CURSOU|MATRICULADO_EM]->(d)\n  AND NOT EXISTS {\n    (p:Disciplina)-[:PRE_REQUISITO]->(d)\n    WHERE NOT (a)-[:CURSOU]->(p) }\nRETURN d.nome, count(DISTINCT f) AS amigos\nORDER BY amigos DESC`;
    sq=`SELECT d.nome, COUNT(DISTINCT h.id_aluno) AS amigos\n FROM amizade am\n JOIN historico h ON h.id_aluno = am.id_amigo\n JOIN disciplina d ON d.id = h.id_disc\n WHERE am.id_aluno = ?\n   AND d.id NOT IN (SELECT id_disc FROM historico\n                     WHERE id_aluno = ?)\n   AND NOT EXISTS (\n     SELECT 1 FROM pre_requisito pr\n      WHERE pr.id_disc = d.id AND pr.id_pre NOT IN (\n        SELECT id_disc FROM cursou\n         WHERE id_aluno = ?))\n GROUP BY d.nome ORDER BY amigos DESC;`;
    const fs=adj[a].filter(e=>e.rel==='AMIGO_DE').map(e=>e.to),isR=e=>e.rel==='CURSOU'||e.rel==='MATRICULADO_EM',
      had=new Set(adj[a].filter(isR).map(e=>e.to)),cu=new Set(out(a,'CURSOU').map(e=>e.to)),c=new Map();
    for(const f of fs)for(const e of adj[f])if(isR(e)&&e.dir>0&&!had.has(e.to)&&inc(e.to,'PRE_REQUISITO').every(x=>cu.has(x.to))){if(!c.has(e.to))c.set(e.to,new Set());c.get(e.to).add(f)}
    hl[a]='src';c.forEach((s,d)=>{hl[d]='res';s.forEach(f=>{hl[f]='mid';E(a,f);E(f,d)})});
    const rk=[...c].sort((x,y)=>y[1].size-x[1].size);
    o=`Para <b>${A}</b> (já cursou ${[...cu].map(nm).join(', ')||'nada'}), amigos sugerem: <b>${rk.map(([d,s])=>`${nm(d)} (${s.size} ${s.size>1?'amigos':'amigo'})`).join(', ')||'nada novo'}</b>`;
  }else{
    cy=`MATCH p = shortestPath(\n  (a:Aluno {nome:'${A}'})-[*]-\n  (m:Professor {nome:'${B}'}))\nRETURN p`;
    sq=`-- Sem equivalente simples:\n-- exigiria CTE recursiva com UNION de\n-- cursou, matricula, ministra,\n-- pre_requisito e amizade, com controle\n-- manual de ciclos e de direção.`;
    const prev={[a]:null},Q=[a];
    for(let h=0;h<Q.length;h++){const u=Q[h];if(u===b)break;for(const e of adj[u])if(!(e.to in prev)){prev[e.to]={u,rel:e.rel,dir:e.dir};Q.push(e.to)}}
    if(!(b in prev))o='Sem caminho.';else{
      const hops=[];for(let c=b;prev[c];c=prev[c].u)hops.unshift({c,...prev[c]});
      hl[a]='src';hl[b]='res';let s=`<b>${A}</b>`;
      hops.forEach(h=>{if(h.c!==b)hl[h.c]='mid';E(h.u,h.c);L(h.u,h.c,h.rel);s+=h.dir>0?` -[:${h.rel}]→ `:` ←[:${h.rel}]- `;s+=`<b>${nm(h.c)}</b>`});
      o=`${s} (${hops.length} saltos)`}
  }
  $('cy').textContent=cy;$('sq').textContent=sq;
  $('hc').textContent=`(${cy.split('\n').length} linhas)`;$('hs').textContent=`(${sq.split('\n').length} linhas)`;$('out').innerHTML=o;
}
function fill(sel,arr,base,val){sel.innerHTML='';arr.forEach((n,i)=>sel.add(new Option(n,base+i)));sel.value=val}
function setup(){const q=$('q').value;
  $('sa').style.display=q==='3'||q==='4'?'':'none';
  if(q==='4')fill($('sb'),P,S.length+D.length,pi('Jorge'));else if(q==='3')$('sb').style.display='none';
  if(q!=='3')$('sb').style.display='';
  if(q==='1'||q==='2')fill($('sb'),D,S.length,di('Banco de Dados'));
  run()}
fill($('sa'),S,0,si('Gustavo'));
$('q').onchange=setup;$('sa').onchange=run;$('sb').onchange=run;

// ---- render 3D ----
let W,H,DPR,yaw=.5,pitch=.25,zoom=1,drag=null,hover=-1;
function resize(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
function proj(){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),sc=Math.min(W,H*.75)*.36*zoom,f=3;
  for(const n of nodes){let x=n.x*cy+n.z*sy,z=-n.x*sy+n.z*cy,y=n.y*cp-z*sp;z=n.y*sp+z*cp;const p=f/(f+z);n.sx=W/2+x*sc*p;n.sy=H*.34+y*sc*p;n.p=p;n.d=(z+1.4)/2.8}}
const tcol={Aluno:'--tp',Disciplina:'--te',Professor:'--ti'},rcol={src:'--a',mid:'--b',res:'--res'};
function draw(t){
  if(!drag)yaw+=.002;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);proj();
  const EC=css('--edge'),anyHl=Object.keys(hl).length>0,hc=css('--res');
  for(const e of edges){const p=nodes[e.a],q=nodes[e.b],on=hle.has(ek(e.a,e.b));
    if(on){ctx.strokeStyle=hc;ctx.lineWidth=3;ctx.shadowColor=hc;ctx.shadowBlur=10}
    else{ctx.strokeStyle=`rgba(${EC},${(anyHl?.07:.14)+.25*(1-(p.d+q.d)/2)})`;ctx.lineWidth=1;ctx.shadowBlur=0}
    ctx.beginPath();ctx.moveTo(p.sx,p.sy);ctx.lineTo(q.sx,q.sy);ctx.stroke();
    if(e.rel!=='AMIGO_DE'){const dx=q.sx-p.sx,dy=q.sy-p.sy,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,tx=q.sx-ux*9*q.p,ty=q.sy-uy*9*q.p;
      ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx-ux*7-uy*3.5,ty-uy*7+ux*3.5);ctx.lineTo(tx-ux*7+uy*3.5,ty-uy*7-ux*3.5);ctx.fill()}}
  ctx.shadowBlur=0;
  const order=nodes.map((_,i)=>i).sort((a,b)=>nodes[b].d-nodes[a].d),lab=[];
  for(const i of order){const n=nodes[i],role=hl[i];
    let r=(n.t==='Disciplina'?6:4.5)*n.p*1.4,col=css(tcol[n.t]),al=(anyHl?.35:.55)+.45*(1-n.d);
    if(role){col=css(rcol[role]);r=role==='src'?10+Math.sin(t/250)*1.5:7.5;al=1;lab.push(i)}
    if(i===hover){r+=3;al=1;if(!role)lab.push(i)}
    ctx.globalAlpha=al;ctx.fillStyle=col;ctx.beginPath();ctx.arc(n.sx,n.sy,r,0,7);ctx.fill()}
  ctx.globalAlpha=1;ctx.font='600 12px system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle=css('--fg');
  lab.forEach(i=>ctx.fillText(nodes[i].name,nodes[i].sx,nodes[i].sy-14));
  ctx.font='11px system-ui,sans-serif';
  elab.forEach((txt,k)=>{const[a,b]=k.split('-'),p=nodes[a],q=nodes[b],x=(p.sx+q.sx)/2,y=(p.sy+q.sy)/2,s=String(txt),w=ctx.measureText(s).width+8;
    ctx.fillStyle=css('--panel');ctx.fillRect(x-w/2,y-8,w,16);ctx.fillStyle=hc;ctx.fillText(s,x,y+4)});
  requestAnimationFrame(draw)}
const pick=(x,y)=>{let b=-1,bd=300;nodes.forEach((n,i)=>{const d=(n.sx-x)**2+(n.sy-y)**2;if(d<bd){bd=d;b=i}});return b};
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(drag){yaw+=(e.clientX-drag.x)*.006;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag.y)*.006));drag.x=e.clientX;drag.y=e.clientY}else hover=pick(e.clientX,e.clientY)});
cv.addEventListener('pointerup',()=>{drag=null});
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2.5,zoom*(e.deltaY<0?1.08:.92)))},{passive:false});
addEventListener('resize',resize);resize();setup();requestAnimationFrame(draw);
</script>
</body>
</html>
